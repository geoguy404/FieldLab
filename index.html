<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Field Lab - an interactive field simulation</h1>
    <main class="simulation-layout">
        <section class="canvas-panel">
            <h2>Simulation</h2>
            <canvas id="field-canvas" width="600" height="400"></canvas>
        </section>
        <aside class="control-panel">
            <h2>Controls</h2>
            <button id="add-charge-positive">Add positive charge</button>
            <button id="add-charge-negative">Add negative charge</button>
            <button id="reset-button">Reset</button>
            <button id="theme-toggle">Toggle theme</button>
            <button id="grid-toggle">Toggle grid</button>
        </aside>
         <section class="info-panel">
            <label class ="info-panel-label">
            x: 
            <input type="text" id="x-coordinate">
            </label>
            <label class ="info-panel-label">
            y: 
            <input type="text" id="x-coordinate">
            </label>
            <label class ="info-panel-label">
                charge:  positive
            </label>
            
        </section>


    </main>

     <p id="status"> Loading python...</p>
    <button id="run-button" disabled> Run python</button>
    <p id="output"></p>


    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <script src="main.js"></script>
</body>
</html>
