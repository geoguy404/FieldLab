<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldLab</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./FieldLab.svg" type="image/svg+xml">
</head>
<body>
    <div id="heading">
        <span>
            <h1>Field Lab | An interactive field simulation</h1>
        </span>
        <aside>
            <div>
                <input type="checkbox" class="checkbox" id="theme-checkbox">
                <label for="theme-checkbox" class="checkbox-label">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                    <span class="ball"></span>
                </label>
            </div>
        </aside>
    </div>
    <main class="simulation-layout">
        <section class="canvas-panel">
            <h2>Simulation</h2>
            <canvas id="field-canvas" width="600" height="400"></canvas>
            <section class="info-panel">
                <label class="info-panel-label">
                    x:
                    <input type="number" id="x-coordinate" step="0.1">
                </label>

                <label class="info-panel-label">
                    y:
                    <input type="number" id="y-coordinate" step="0.1">
                </label>

                <label class="info-panel-label">
                    Charge:
                    <span id="charge-value">No charge selected</span>
                </label>
                <section class="selected-charge">
                <input id="charge-slider" type="range" min="-5" max="5" step="0.1" disabled>
                <button id="delete-charge" disabled>
                    Delete selected charge
                </button>
            </section>
            </section>
        </section>
        <aside class="control-panel">
            <h2>Controls</h2>
            <button id="add-charge-positive">Add positive charge</button>
            <button id="add-charge-negative">Add negative charge</button>
            <button id="reset-button">Reset</button>
            <button id="grid-toggle">Toggle grid</button>
        </aside>
    </main>
    <script src="main.js"></script>
</body>
</html>
